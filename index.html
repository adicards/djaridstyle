<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TÍTULO Y META TAGS PARA LA PREVISUALIZACIÓN EN WHATSAPP (3ª FOTO) -->
    <title>Dj Aridstyle | MC/DJ - Sabrosura Hot</title>
    <meta name="description" content="MC/DJ - Sabrosura Hot. Tarjeta Digital Business por AdiCards.">
    
    <!-- Meta Tags Open Graph (Lo que lee WhatsApp al compartir) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dj Aridstyle">
    <meta property="og:description" content="MC/DJ - Sabrosura Hot">
    <meta property="og:image" content="https://adicards.github.io/djaridstyle/DjAridStyle.jpg"> <!-- Enlace directo a la foto de perfil -->
    <meta property="og:url" content="https://adicards.github.io/djaridstyle">

    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           ESTILOS BASE Y VARIABLES - ESTILO PREMIUM APP
           ========================================================================== */
        :root {
            --bg-body: #000000;
            --card-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-muted: #666666;
            --accent-circle: #2c2c2e;
            --accent-btn: #2c2c2e;
            --radius-card: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-bottom: 90px; /* Espacio para el dock flotante inferior */
        }

        /* Contenedor tipo pantalla de Smartphone */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-body);
            position: relative;
        }

        /* ==========================================================================
           HERO SECTION (FOTO COMPLETA Y TÍTULO OVERLAY)
           ========================================================================== */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 420px;
            background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1000&auto=format&fit=crop'); /* Cambiar por foto real */
            background-size: cover;
            background-position: center top;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
        }

        /* Sombrado para legibilidad del texto sobre la foto */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #e5e5e5;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .hero-tag {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .mini-avatar {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* ==========================================================================
           ACCIONES RÁPIDAS (BOTONES CIRCULARES)
           ========================================================================== */
        .quick-actions {
            display: flex;
            justify-content: flex-start;
            gap: 16px;
            padding: 24px 20px 12px 20px;
        }

        .action-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--accent-circle);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .action-circle:active {
            transform: scale(0.92);
        }

        /* ==========================================================================
           CARDS BLANCAS DE CONTENIDO (ABOUT / CONTACTO)
           ========================================================================== */
        .content-section {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .white-card {
            background-color: var(--card-white);
            color: var(--text-dark);
            border-radius: var(--radius-card);
            padding: 24px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .card-description {
            font-size: 1rem;
            text-align: center;
            color: var(--text-muted);
        }

        /* Card de Contacto */
        .contact-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .icon-box-black {
            width: 44px;
            height: 44px;
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .contact-info-group {
            border-top: 1px dashed #e5e5e5;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .info-item label {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .info-item span {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* ==========================================================================
           BRANDING ADICARDS (REEMPLAZO DE MARCA EN RAYÓN ROJO)
           ========================================================================== */
        .adicards-branding {
            text-align: center;
            padding: 28px 16px 12px;
        }

        .adicards-branding img {
            max-width: 140px;
            height: auto;
            opacity: 0.9;
        }

        /* ==========================================================================
           BARRA FLOTANTE INFERIOR (DOCK FIXED)
           ========================================================================== */
        .dock-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .dock-left-buttons {
            display: flex;
            gap: 10px;
        }

        .dock-btn-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #262626;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .dock-btn-main {
            background-color: #2c2c2e;
            color: #ffffff;
            padding: 8px 12px 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .dock-btn-main span {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.2;
            text-align: right;
        }

        .plus-circle {
            width: 34px;
            height: 34px;
            background-color: #ffffff;
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Banner Principal con Foto -->
        <div class="hero-banner">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title">Dj Aridstyle</h1>
                <p class="hero-subtitle">MC/DJ</p>
                <p class="hero-tag">Sabrosura Hot</p>
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200" alt="Thumb" class="mini-avatar">
            </div>
        </div>

        <!-- Botones Circulares Rápidos -->
        <div class="quick-actions">
            <a href="tel:9985010024" class="action-circle">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </a>
            <a href="mailto:contactme@domain.com" class="action-circle">
                <i class="fa-regular fa-envelope"></i>
            </a>
            <a href="https://wa.me/529985010024" class="action-circle">
                <i class="fa-regular fa-comment-dots"></i>
            </a>
        </div>

        <!-- Secciones de Contenido (Cards Blancas) -->
        <div class="content-section">
            
            <!-- Card 1: About Me -->
            <div class="white-card">
                <h2 class="card-title">Acerca de Mi</h2>
                <p class="card-description">Descripcion</p>
            </div>

            <!-- Card 2: Contacto -->
            <div class="white-card">
                <div class="contact-header">
                    <div class="icon-box-black">
                        <i class="fa-solid fa-mobile-screen-button"></i>
                    </div>
                    <span>Contacto</span>
                </div>

                <div class="contact-info-group">
                    <div class="info-item">
                        <label>Llama al:</label>
                        <span>9985010024</span>
                    </div>
                    <div class="info-item">
                        <label>Email</label>
                        <span>contactme@domain.com</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- SECCIÓN LOGO ADICARDS (Donde estaba el rayón rojo) -->
        <div class="adicards-branding">
            <!-- Reemplazar con la ruta de tu imagen de adicardslogo.png -->
            <img src="adicards-logo.png" alt="Diseñado por AdiCards">
        </div>

        <!-- Barra Inferior Flotante (Dock) -->
        <div class="dock-bar">
            <div class="dock-left-buttons">
                <a href="#" class="dock-btn-icon" title="Ver QR">
                    <i class="fa-solid fa-qrcode"></i>
                </a>
                <a href="#" class="dock-btn-icon" title="Compartir">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </a>
            </div>

            <a href="#" class="dock-btn-main">
                <span>Añadir<br>Contacto</span>
                <div class="plus-circle">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </a>
        </div>

    </div>

</body>
</html>
